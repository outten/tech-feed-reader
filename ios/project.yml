name: TechFeedReader
options:
  bundleIdPrefix: com.techfeedreader # PLACEHOLDER — replace once a real Team ID / bundle id is chosen (Phase 2)
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    TARGETED_DEVICE_FAMILY: "1,2" # iPhone + iPad
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: Tech Feed Reader
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    INFOPLIST_KEY_UISupportedInterfaceOrientations~ipad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
targets:
  TechFeedReader:
    type: application
    platform: iOS
    sources:
      - path: TechFeedReader
        excludes:
          - "Info-Debug.plist"
          - "Info-Release.plist"
    configFiles:
      Debug: xcconfig/Debug.xcconfig
      Release: xcconfig/Release.xcconfig
    settings:
      configs:
        Debug:
          INFOPLIST_FILE: TechFeedReader/Info-Debug.plist
          PRODUCT_BUNDLE_IDENTIFIER: com.techfeedreader.ios
        Release:
          INFOPLIST_FILE: TechFeedReader/Info-Release.plist
          PRODUCT_BUNDLE_IDENTIFIER: com.techfeedreader.ios
schemes:
  # XcodeGen's auto-generated default scheme runs the Debug config (which
  # points at localhost:4567) whenever Xcode's own Run button is used —
  # bitten us once already on the iPad Simulator. Pin every scheme action
  # to Release (production) instead; explicit `-configuration Debug`
  # command-line builds are still available for local dev-loop iteration.
  TechFeedReader:
    build:
      targets:
        TechFeedReader: all
    run:
      config: Release
    test:
      config: Release
    profile:
      config: Release
    analyze:
      config: Release
    archive:
      config: Release
